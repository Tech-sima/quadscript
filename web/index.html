<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статус юзер-ботов</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="column left">
      <h2>Список юзер-ботов</h2>
      <textarea id="botListInput" placeholder="Вставьте список ботов, по одному на строку..."></textarea>
      <button id="saveBots">Сохранить список</button>
    </div>
    <div class="column right">
      <h2>Статус ботов</h2>
      <ul id="botStatusList"></ul>
    </div>
  </div>
</body>
</html>
